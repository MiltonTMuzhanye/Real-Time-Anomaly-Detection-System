version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports
    depends_on:
      - api