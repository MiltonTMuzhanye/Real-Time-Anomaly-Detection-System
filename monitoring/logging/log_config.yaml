version: 1
formatters:
  default:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
  file:
    class: logging.handlers.RotatingFileHandler
    filename: monitoring/logging/app.log
    maxBytes: 20971520
    backupCount: 5
    formatter: default
root:
  level: INFO
  handlers: [console, file]
