project:
  name: "Real-Time Anomaly Detection System"
  version: "0.1.0"
  seed: 42

paths:
  nab_root: "data/raw/nab"
  processed_dir: "data/processed"
  artifacts_dir: "artifacts"
  reports_dir: "reports"

data:
  window_size: 128
  stride: 16
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  max_series: 20

thresholds:
  method: "percentile" 
  k_sigma: 3.0
  percentile: 99.0
  fixed: 0.65